<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Pruebas - GPCONES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2E8B57 0%, #1E90FF 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2E8B57 0%, #1E90FF 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 139, 87, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2E8B57;
        }

        .stat-card.passed .value {
            color: #28a745;
        }

        .stat-card.failed .value {
            color: #dc3545;
        }

        .stat-card.skipped .value {
            color: #ffc107;
        }

        .test-suite {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .suite-header {
            background: #f8f9fa;
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .suite-header:hover {
            background: #e9ecef;
        }

        .suite-header h2 {
            color: #333;
            font-size: 1.5em;
        }

        .suite-status {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .test-list {
            display: none;
            padding: 20px;
        }

        .test-list.show {
            display: block;
        }

        .test-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #ddd;
            background: #f8f9fa;
            transition: all 0.3s;
        }

        .test-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .test-item.passed {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .test-item.failed {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .test-item.skipped {
            border-left-color: #ffc107;
            background: #fff3cd;
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .test-name {
            font-weight: 600;
            color: #333;
        }

        .test-details {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2E8B57;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .log-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
        }

        .log-output.show {
            display: block;
        }

        .log-line {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-success { color: #4ec9b0; }
        .log-error { color: #f48771; }
        .log-info { color: #9cdcfe; }
        .log-test { color: #569cd6; }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Pruebas Automatizadas - GPCONES</h1>
            <p>Sistema de Catastro Integral - Resultados de Pruebas en Tiempo Real</p>
        </div>

        <div class="content">
            <div class="controls">
                <button class="btn btn-primary" onclick="runAllTests()">
                    ▶️ Ejecutar Todas las Pruebas
                </button>
                <button class="btn btn-secondary" onclick="loadReport()">
                    📄 Cargar Reporte Guardado
                </button>
                <button class="btn btn-secondary" onclick="toggleLogs()">
                    📋 Ver Logs
                </button>
            </div>

            <div id="statusBar" class="status-bar" style="display: none;">
                <div class="stat-card">
                    <h3>Total de Pruebas</h3>
                    <div class="value" id="totalTests">0</div>
                </div>
                <div class="stat-card passed">
                    <h3>Aprobadas</h3>
                    <div class="value" id="passedTests">0</div>
                </div>
                <div class="stat-card failed">
                    <h3>Fallidas</h3>
                    <div class="value" id="failedTests">0</div>
                </div>
                <div class="stat-card skipped">
                    <h3>Omitidas</h3>
                    <div class="value" id="skippedTests">0</div>
                </div>
            </div>

            <div id="testResults"></div>

            <div id="logOutput" class="log-output"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3002/api';
        let testResults = null;

        function addLog(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const logLine = document.createElement('div');
            logLine.className = `log-line log-${type}`;
            logLine.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logOutput.appendChild(logLine);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function toggleLogs() {
            const logOutput = document.getElementById('logOutput');
            logOutput.classList.toggle('show');
        }

        async function runAllTests() {
            document.getElementById('statusBar').style.display = 'grid';
            document.getElementById('testResults').innerHTML = '<div class="loading"><div class="spinner"></div><p>Ejecutando pruebas...</p></div>';
            document.getElementById('logOutput').innerHTML = '';
            document.getElementById('logOutput').classList.add('show');
            
            addLog('Iniciando ejecución de pruebas...', 'test');

            try {
                // Nota: En un entorno real, las pruebas se ejecutarían en el servidor
                // Por ahora simulamos o usamos una API si está disponible
                
                addLog('Las pruebas deben ejecutarse desde Node.js', 'info');
                addLog('Ejecuta: node tests/run-all-tests.js', 'info');
                addLog('Luego carga el reporte JSON generado', 'info');
                
                // Intentar cargar reporte si existe
                setTimeout(() => {
                    loadReport();
                }, 1000);

            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                document.getElementById('testResults').innerHTML = 
                    '<div class="no-data">Error ejecutando pruebas. Ver logs para más detalles.</div>';
            }
        }

        function loadReport() {
            fetch('tests/test-report.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Reporte no encontrado. Ejecuta las pruebas primero.');
                    }
                    return response.json();
                })
                .then(data => {
                    testResults = data;
                    displayResults(data);
                    addLog('Reporte cargado exitosamente', 'success');
                })
                .catch(error => {
                    addLog(`No se pudo cargar el reporte: ${error.message}`, 'error');
                    document.getElementById('testResults').innerHTML = 
                        '<div class="no-data">No hay reporte disponible. Ejecuta las pruebas primero desde Node.js.</div>';
                });
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('testResults');
            const statusBar = document.getElementById('statusBar');
            
            // Actualizar estadísticas
            document.getElementById('totalTests').textContent = data.resumen.total || 0;
            document.getElementById('passedTests').textContent = data.resumen.aprobadas || 0;
            document.getElementById('failedTests').textContent = data.resumen.fallidas || 0;
            document.getElementById('skippedTests').textContent = data.resumen.omitidas || 0;
            
            statusBar.style.display = 'grid';

            // Mostrar suites
            let html = '';
            if (data.suites && data.suites.length > 0) {
                data.suites.forEach((suite, index) => {
                    const passed = suite.passed || 0;
                    const failed = suite.failed || 0;
                    const skipped = suite.skipped || 0;
                    const total = passed + failed + skipped;
                    const successRate = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;

                    html += `
                        <div class="test-suite">
                            <div class="suite-header" onclick="toggleSuite(${index})">
                                <h2>${suite.name || 'Suite de Pruebas'}</h2>
                                <div class="suite-status">
                                    <span class="badge badge-success">✓ ${passed}</span>
                                    ${failed > 0 ? `<span class="badge badge-danger">✗ ${failed}</span>` : ''}
                                    ${skipped > 0 ? `<span class="badge badge-warning">⊘ ${skipped}</span>` : ''}
                                    <span style="color: #666; margin-left: 10px;">${successRate}% éxito</span>
                                </div>
                            </div>
                            <div class="test-list" id="suite-${index}">
                                ${renderTestList(suite.tests || [])}
                            </div>
                        </div>
                    `;
                });
            } else {
                html = '<div class="no-data">No hay resultados de pruebas disponibles</div>';
            }

            resultsDiv.innerHTML = html;
        }

        function renderTestList(tests) {
            if (!tests || tests.length === 0) {
                return '<div class="no-data">No hay pruebas en esta suite</div>';
            }

            return tests.map(test => {
                const status = test.skipped ? 'skipped' : (test.passed ? 'passed' : 'failed');
                const icon = test.skipped ? '⊘' : (test.passed ? '✓' : '✗');
                const statusText = test.skipped ? 'Omitida' : (test.passed ? 'Aprobada' : 'Fallida');
                
                return `
                    <div class="test-item ${status}">
                        <div class="test-header">
                            <span class="test-name">${icon} ${test.name}</span>
                            <span class="badge badge-${status === 'passed' ? 'success' : status === 'failed' ? 'danger' : 'warning'}">
                                ${statusText}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleSuite(index) {
            const suiteList = document.getElementById(`suite-${index}`);
            suiteList.classList.toggle('show');
        }

        // Cargar reporte al iniciar si existe
        window.addEventListener('DOMContentLoaded', () => {
            loadReport();
        });
    </script>
</body>
</html>
